name: Publish verified images

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish-ghcr
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Locate successful PR CI run for the exact source SHA
        id: run
        shell: bash
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Pull request CI" --commit "$SOURCE_SHA" --event pull_request --status success --limit 20 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" && test "$run_id" != "null" || { echo '::error::No successful Pull request CI run exists for the merged source SHA.'; exit 1; }
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download images built and scanned by PR CI
        run: gh run download "${{ steps.run.outputs.id }}" --repo "$GITHUB_REPOSITORY" --name "verified-images-$SOURCE_SHA" --dir verified-images
      - name: Validate source manifest and detect images to promote
        id: manifest
        shell: bash
        run: |
          jq -e --arg sha "$SOURCE_SHA" '.sourceSha == $sha and (.images | all(. == "api" or . == "worker"))' verified-images/image-manifest.json >/dev/null
          has_images=$(jq -r '(.images | length) > 0' verified-images/image-manifest.json)
          echo "has_images=$has_images" >> "$GITHUB_OUTPUT"
          if [[ "$has_images" != "true" ]]; then
            echo 'No API or worker image changed; publication is not required.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Load the scanned image archive
        if: steps.manifest.outputs.has_images == 'true'
        run: docker load --input verified-images/verified-images.tar
      - name: Authenticate to GHCR with the job-scoped token
        if: steps.manifest.outputs.has_images == 'true'
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push verified images and record immutable digests
        if: steps.manifest.outputs.has_images == 'true'
        shell: bash
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          : > image-digests.txt
          for component in api worker; do
            source_image="cafeteria-$component:$SOURCE_SHA"
            if docker image inspect "$source_image" >/dev/null 2>&1; then
              target_image="$prefix/$component:$SOURCE_SHA"
              docker tag "$source_image" "$target_image"
              docker push "$target_image"
              digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$target_image")
              test -n "$digest" || { echo "::error::No registry digest returned for $component."; exit 1; }
              printf '%s\n' "$digest" >> image-digests.txt
              printf '%s artifact: `%s`\nSource SHA: `%s`\n' "$component" "$digest" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          test -s image-digests.txt || { echo '::error::The verified CI archive listed images but contained none.'; exit 1; }

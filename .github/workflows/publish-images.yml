name: Publish verified images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish-ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Normalize GHCR namespace
        id: images
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build API image for this immutable commit
        run: docker build --pull --tag "${{ steps.images.outputs.prefix }}/api:${GITHUB_SHA}" --file apps/api/Dockerfile .
      - name: Scan API image before registry publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.prefix }}/api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Build worker image for this immutable commit
        run: docker build --pull --tag "${{ steps.images.outputs.prefix }}/worker:${GITHUB_SHA}" --file apps/worker/Dockerfile .
      - name: Scan worker image before registry publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.prefix }}/worker:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Authenticate to GHCR with the job-scoped token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push scanned API and worker images
        id: push
        shell: bash
        run: |
          docker push "${{ steps.images.outputs.prefix }}/api:${GITHUB_SHA}"
          api_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.images.outputs.prefix }}/api:${GITHUB_SHA}")
          docker push "${{ steps.images.outputs.prefix }}/worker:${GITHUB_SHA}"
          worker_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.images.outputs.prefix }}/worker:${GITHUB_SHA}")
          printf 'API artifact: `%s`\nWorker artifact: `%s`\nSource SHA: `%s`\n' "$api_digest" "$worker_digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

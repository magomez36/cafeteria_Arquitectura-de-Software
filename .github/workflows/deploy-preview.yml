name: Preview deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-ci:
    name: require-ci
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout the PR merge tree for the read-only check verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify all required PR checks for the exact head SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/deploy/require-pr-checks.mjs

  deploy-preview:
    name: deploy-preview
    needs: [require-ci]
    if: needs.require-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout the exact CI-verified SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.4
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Vercel preview configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          RENDER_STAGING_API_URL: ${{ vars.RENDER_STAGING_API_URL }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::Configure VERCEL_TOKEN in the preview GitHub Environment.'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo '::error::Configure VERCEL_ORG_ID in the preview GitHub Environment.'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo '::error::Configure VERCEL_PROJECT_ID in the preview GitHub Environment.'; exit 1; }
          test -n "$RENDER_STAGING_API_URL" || { echo '::error::Configure RENDER_STAGING_API_URL to the owner-provided staging API URL.'; exit 1; }
      - name: Pull non-secret preview configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: pnpm exec vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --cwd=apps/web
      - name: Build the Vercel prebuilt artifact without deploy credentials
        run: pnpm exec vercel build --yes --target=preview --cwd=apps/web
      - name: Deploy the prebuilt preview
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(pnpm exec vercel deploy --prebuilt --token="$VERCEL_TOKEN" --cwd=apps/web)
          [[ "$deployment_url" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]] || { echo '::error::Vercel did not return a valid preview URL.'; exit 1; }
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Vercel preview: [%s](%s)\n' "$deployment_url" "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Chromium for preview smoke and accessibility tests
        run: pnpm --filter @cafeteria/web exec playwright install --with-deps chromium
      - name: Verify preview web and shared staging API
        env:
          WEB_BASE_URL: ${{ steps.deploy.outputs.url }}
          API_BASE_URL: ${{ vars.RENDER_STAGING_API_URL }}
          CI: true
        run: pnpm --filter @cafeteria/web test:e2e

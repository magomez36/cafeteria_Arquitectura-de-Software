name: Staging revert rehearsal

on:
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-revert-drill
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the app-only revert in a temporary repository
        id: prepare
        shell: bash
        env:
          REVERT_SHA: ${{ vars.REVERT_DRILL_SHA }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule && -z "$REVERT_SHA" ]]; then
            echo 'REVERT_DRILL_SHA is not configured; rehearsal did not run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/deploy/revert-drill.mjs "$REVERT_SHA" > "$RUNNER_TEMP/revert.patch"
          git apply --index "$RUNNER_TEMP/revert.patch"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        if: steps.prepare.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.4
      - name: Set up Node.js
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the candidate revert
        if: steps.prepare.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          echo 'Isolated revert passed local checks. Required PR checks and staging remain to be verified on a real rehearsal PR.' >> "$GITHUB_STEP_SUMMARY"

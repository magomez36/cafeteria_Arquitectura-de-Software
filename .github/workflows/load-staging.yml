name: Staging load test

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-load-test
  cancel-in-progress: false

jobs:
  k6:
    name: k6-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Require explicitly configured staging endpoints
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          test -n "$STAGING_BASE_URL" || { echo '::error::Set STAGING_BASE_URL in the staging Environment.'; exit 1; }
          test -n "$STAGING_API_URL" || { echo '::error::Set STAGING_API_URL in the staging Environment.'; exit 1; }
          node scripts/load/validate-staging-targets.mjs
      - name: Run low-volume staging-only load scenario
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: go run go.k6.io/k6@v0.54.0 run tests/load/staging.js

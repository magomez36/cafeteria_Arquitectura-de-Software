services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: cafeteria, POSTGRES_PASSWORD: cafeteria_local, POSTGRES_DB: cafeteria }
    ports: ["55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cafeteria -d cafeteria"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 20 }
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
    healthcheck: { test: ["CMD", "/mailpit", "readyz"], interval: 5s, timeout: 3s, retries: 10 }
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

apiVersion: 1
datasources:
  - name: Cafeteria GitHub
    type: grafana-github-datasource
    uid: cafeteria-github
    access: proxy
    jsonData:
      selectedAuthType: github-app
      appId: $GRAFANA_GITHUB_APP_ID
      installationId: $GRAFANA_GITHUB_INSTALLATION_ID
    secureJsonData:
      privateKey: $GRAFANA_GITHUB_APP_PRIVATE_KEY
    editable: false
  - name: Cafeteria Delivery Metrics
    type: prometheus
    uid: DS_PROMETHEUS
    access: proxy
    url: $GRAFANA_CLOUD_PROMETHEUS_URL
    basicAuth: true
    basicAuthUser: $GRAFANA_CLOUD_METRICS_USER
    secureJsonData:
      basicAuthPassword: $GRAFANA_CLOUD_METRICS_READ_TOKEN
    isDefault: true
    editable: false

# Project identity is provided by the protected GitHub Actions variables
# SONAR_PROJECT_KEY and SONAR_ORGANIZATION. Never commit an access token here.
sonar.sources=apps/api/src,apps/web/src,apps/worker/src,packages/contracts/src,packages/feature-flags/src,packages/ui/src
sonar.tests=apps/api/test,apps/api/src,apps/worker/test,apps/worker/src,apps/web,packages/contracts,packages/feature-flags,packages/ui
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.int-spec.ts,**/*.e2e-spec.ts
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/worker/coverage/lcov.info,apps/web/coverage/lcov.info,packages/contracts/coverage/lcov.info,packages/feature-flags/coverage/lcov.info,packages/ui/coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.int-spec.ts,**/*.e2e-spec.ts,**/*.d.ts
sonar.exclusions=**/dist/**,**/.next/**,**/coverage/**,**/node_modules/**,**/test-results/**
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
